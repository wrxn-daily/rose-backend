<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROSE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 2rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
      color: #333;
    }
    .chat {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #f9f9f9;
    }
    .message {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: 5px;
      max-width: 80%;
    }
    .message.user {
      background: #667eea;
      color: white;
      margin-left: auto;
      text-align: right;
    }
    .message.assistant {
      background: #e0e0e0;
      color: #333;
      margin-right: auto;
    }
    .input-area {
      display: flex;
      gap: 0.5rem;
    }
    input {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
    }
    button {
      padding: 0.75rem 1.5rem;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ROSE</h1>
    <div class="chat" id="chat"></div>
    <div class="input-area">
      <input type="text" id="input" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatDiv = document.getElementById('chat')
    const inputDiv = document.getElementById('input')

    function addMessage(text, isUser) {
      const msg = document.createElement('div')
      msg.className = isUser ? 'message user' : 'message assistant'
      msg.textContent = text
      chatDiv.appendChild(msg)
      chatDiv.scrollTop = chatDiv.scrollHeight
    }

    async function sendMessage() {
      const text = inputDiv.value.trim()
      if (!text) return

      addMessage(text, true)
      inputDiv.value = ''

      try {
        const response = await fetch('/.netlify/functions/process-message', {
          method: 'POST',
          body: JSON.stringify({ content: text }),
        })
        const data = await response.json()
        addMessage(data.message || 'ROSE: I heard you!', false)
      } catch (error) {
        addMessage('Error: ' + error.message, false)
      }
    }

    inputDiv.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage()
    })
  </script>
</body>
</html>
